<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Brightstack">
  <defs>
    <linearGradient id="bsMark" gradientUnits="userSpaceOnUse" x1="16" y1="11" x2="84" y2="89">
      <stop offset="0" stop-color="#00D4FF" />
      <stop offset="0.5" stop-color="#3B5BFF" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
  </defs>
  <!-- Three stacked isometric layers: flat top rhombus + two chevrons,
