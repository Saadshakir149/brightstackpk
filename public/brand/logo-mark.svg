    <path d="M50 11 L84 29 L50 47 L16 29 Z" />
    <path d="M16 42 L50 60 L84 42 L84 50 L50 68 L16 50 Z" />
    <path d="M16 63 L50 81 L84 63 L84 71 L50 89 L16 71 Z" />
  </g>
